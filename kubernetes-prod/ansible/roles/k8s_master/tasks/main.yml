---
- name: Initialize Kubernetes cluster
  ansible.builtin.command:
    cmd: kubeadm init --pod-network-cidr={{ pod_network_cidr }} --kubernetes-version=v{{ kubernetes_version }}.0
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for user
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy admin.conf to user .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ ansible_user }}/.kube/config
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
    remote_src: true

- name: Create to root .kube/config
  ansible.builtin.file:
    path: /root/.kube
    owner: root
    group: root
    mode: '0700'
    state: directory

- name: Copy admin.conf to root .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    owner: root
    group: root
    mode: '0644'
    remote_src: true

- name: Install Flannel CNI
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/kube-flannel.yml
  changed_when: false

- name: Save kubeadm join command to file
  ansible.builtin.shell:
    cmd: kubeadm token create --print-join-command 2>/dev/null
  register: k8s_master_join_command
  changed_when: false

- name: Write join command to file
  ansible.builtin.copy:
    content: "{{ k8s_master_join_command.stdout }}"
    dest: /tmp/kubeadm_join_command
    owner: root
    group: root
    mode: '0644'

- name: Display join command
  ansible.builtin.debug:
    msg: "{{ k8s_master_join_command.stdout }}"
