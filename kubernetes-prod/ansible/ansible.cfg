[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_cache
fact_caching_timeout = 3600
timeout = 60
collections_paths = /home/igor/.ansible/collections:/usr/share/ansible/collections:/home/igor/.pyenv/versions/3.12.13/envs/ansible/lib/python3.12/site-packages/ansible/collections
roles_path = ../roles:/usr/share/ansible/roles:/etc/ansible/roles
vault_password_file= /home/igor/.ansible/.vault_pass_otus

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-%%h-%%p-%%r


