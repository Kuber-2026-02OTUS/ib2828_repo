apiVersion: v1
kind: PersistentVolume
metadata:
  name: homework-mysql-pv
spec:
  storageClassName: "local-path"
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  local:
    path: "/mnt/data"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - infrastructure
